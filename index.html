<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر الإلكتروني | تسوق أونلاين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #f59e0b;
      --whatsapp: #25d366;
      --dark: #0f172a;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; transition: all 0.2s ease; }
    body { background-color: var(--bg); color: var(--dark); padding-bottom: 80px; }

    /* الهيدر العلوي الفخم */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .brand-title h1 { font-size: 19px; font-weight: 800; color: var(--dark); line-height: 1.2; }
    .brand-title p { font-size: 11px; color: var(--text-muted); }

    .header-actions { display: flex; gap: 8px; }
    .btn-header {
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-admin { background: #f1f5f9; color: #334155; }
    .btn-admin:hover { background: #e2e8f0; }
    .btn-cart-toggle { background: var(--primary); color: white; position: relative; }
    .cart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* البانر الإعلاني */
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 35px 20px;
      text-align: center;
      position: relative;
    }
    .hero h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .hero p { font-size: 13px; color: #94a3b8; max-width: 500px; margin: 0 auto; }

    /* شريط البحث والأقسام */
    .filter-section {
      max-width: 1200px;
      margin: 15px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-wrapper { position: relative; width: 100%; }
    .search-wrapper input {
      width: 100%;
      padding: 12px 45px 12px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: white;
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .search-wrapper input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #94a3b8; }

    /* لوحة الإدارة */
    #adminPanel {
      display: none;
      max-width: 1200px;
      margin: 15px auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      border: 2px dashed #38bdf8;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }
    .admin-title { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 15px; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .admin-grid input {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .btn-submit-item {
      grid-column: 1 / -1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    /* شبكة عرض المنتجات */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    
    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
    .card-img-holder { width: 100%; height: 190px; background: #f1f5f9; position: relative; overflow: hidden; }
    .card-img-holder img { width: 100%; height: 100%; object-fit: cover; }
    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.75);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .card-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
    .card-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
    .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; flex: 1; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f8fafc; padding-top: 10px; }
    .card-price { font-size: 18px; font-weight: 800; color: var(--primary); }
    .card-price small { font-size: 12px; font-weight: 600; color: var(--text-muted); }

    .btn-add-cart {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-add-cart:hover { background: var(--primary); color: white; }

    .btn-del-item {
      background: #fee2e2;
      color: #ef4444;
      border: 1px solid #fecaca;
      padding: 6px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      font-weight: 700;
      display: none;
    }

    /* نافذة سلة المشتريات الجانبية */
    .cart-drawer {
      position: fixed;
      top: 0;
      left: -100%;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: white;
      box-shadow: 5px 0 25px rgba(0,0,0,0.15);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cart-drawer.open { left: 0; }
    .cart-header { padding: 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .cart-items-list { flex: 1; overflow-y: auto; padding: 15px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .cart-footer { padding: 18px; border-top: 1px solid var(--border); background: #f8fafc; }
    .btn-checkout {
      background: var(--whatsapp);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }
    .cart-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 150;
    }
    .cart-backdrop.open { display: block; }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand">
      <div class="brand-logo">🏪</div>
      <div class="brand-title">
        <h1>متجر الخدمات والأجهزة</h1>
        <p>طلب فوري وتوصيل سريع</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-header btn-admin" onclick="toggleAdmin()">⚙️ الإدارة</button>
      <button class="btn-header btn-cart-toggle" onclick="toggleCart()">
        🛒 السلة
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <h2>أفضل العروض والأسعار المباشرة</h2>
  <p>اختر ما يناسبك واطلبه مباشرة عبر الواتساب مع معاينة وضمان معتمد</p>
</section>

<div class="filter-section">
  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="ابحث باسم المنتج أو الموديل..." onkeyup="filterItems()">
  </div>
</div>

<!-- لوحة الإدارة -->
<div id="adminPanel">
  <div class="admin-title">⚙️ إضافة صنف جديد (لوحة تحكم المسؤول)</div>
  <div class="admin-grid">
    <input type="text" id="pName" placeholder="اسم المنتج (مثال: كاميرا 5 ميجا ألوان)">
    <input type="number" id="pPrice" placeholder="السعر بالجنيه">
    <input type="text" id="pImg" placeholder="رابط صورة أونلاين (اتركه فارغاً للصورة التلقائية)">
    <input type="text" id="pDesc" placeholder="المواصفات والضمان">
    <button class="btn-submit-item" onclick="saveProductToCloud()">➕ نشر الصنف في المتجر فوراً</button>
  </div>
</div>

<!-- المعرض -->
<div class="container">
  <div class="grid" id="productsGrid">
    <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 50px;">
      ⏳ جاري تحميل المنتجات...
    </div>
  </div>
</div>

<!-- سلة التسوق -->
<div class="cart-backdrop" id="cartBackdrop" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3 style="font-size: 16px;">🛒 قائمة الطلبات (السلة)</h3>
    <button onclick="toggleCart()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
  </div>
  <div class="cart-items-list" id="cartItemsList">
    <p style="text-align: center; color: var(--text-muted); margin-top: 30px;">السلة فارغة حالياً</p>
  </div>
  <div class="cart-footer">
    <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:800;">
      <span>الإجمالي التقريبي:</span>
      <span id="cartTotalPrice" style="color:var(--primary);">0 ج.م</span>
    </div>
    <button class="btn-checkout" onclick="checkoutWhatsApp()">
      إرسال الطلب عبر واتساب 💬
    </button>
  </div>
</div>

<script>
  // رابط قاعدة البيانات الخاص بك
  const DB_URL = "https://my-store-4f1a8-default-rtdb.firebaseio.com/products";

  // رقم تليفونك الشخصي
  const MY_PHONE = "201026516213";

  // كلمة السر الجديدة
  const ADMIN_PASS = "909090";

  let isAdmin = false;
  let allProducts = {};
  let cart = [];

  function toggleAdmin() {
    if (!isAdmin) {
      const pass = prompt("أدخل رمز مرور الإدارة:");
      if (pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('adminPanel').style.display = 'block';
        document.querySelectorAll('.btn-del-item').forEach(b => b.style.display = 'block');
        alert("تم تسجيل الدخول بنجاح كمدير للمتجر!");
      } else {
        alert("كلمة المرور غير صحيحة!");
      }
    } else {
      isAdmin = false;
      document.getElementById('adminPanel').style.display = 'none';
      document.querySelectorAll('.btn-del-item').forEach(b => b.style.display = 'none');
    }
  }

  async function saveProductToCloud() {
    const name = document.getElementById('pName').value.trim();
    const price = document.getElementById('pPrice').value.trim();
    let img = document.getElementById('pImg').value.trim();
    const desc = document.getElementById('pDesc').value.trim();

    if (!name || !price) {
      alert("يرجى كتابة اسم المنتج وسعره");
      return;
    }

    if (!img) {
      img = "https://placehold.co/600x400/0284c7/ffffff?text=" + encodeURIComponent(name);
    }

    const itemData = { name, price, img, desc };

    const res = await fetch(`${DB_URL}.json`, {
      method: 'POST',
      body: JSON.stringify(itemData)
    });

    if (res.ok) {
      alert("تمت إضافة الصنف بنجاح!");
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pImg').value = '';
      document.getElementById('pDesc').value = '';
      loadProducts();
    }
  }

  async function loadProducts() {
    try {
      const res = await fetch(`${DB_URL}.json`);
      allProducts = await res.json() || {};
      renderProducts(allProducts);
    } catch (e) {
      console.error(e);
    }
  }

  function renderProducts(items) {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';
    const keys = Object.keys(items);

    if (keys.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 50px;">لا توجد منتجات معروضة حالياً.</div>';
      return;
    }

    keys.forEach(id => {
      const item = items[id];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-img-holder">
          <span class="card-badge">متوفر</span>
          <img src="${item.img}" alt="${item.name}" onerror="this.src='https://placehold.co/600x400/0f172a/ffffff?text=صورة'">
        </div>
        <div class="card-body">
          <div class="card-name">${item.name}</div>
          <div class="card-desc">${item.desc || 'متاح للحجز والمعاينة المباشرة.'}</div>
          <div class="card-bottom">
            <div class="card-price">${item.price} <small>ج.م</small></div>
            <button class="btn-add-cart" onclick="addToCart('${item.name}', '${item.price}')">أضف للسلة 🛒</button>
          </div>
          <button class="btn-del-item" onclick="deleteProduct('${id}')" style="display: ${isAdmin ? 'block' : 'none'};">حذف الصنف 🗑️</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function filterItems() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = {};
    Object.keys(allProducts).forEach(id => {
      const item = allProducts[id];
      if ((item.name + ' ' + (item.desc || '')).toLowerCase().includes(q)) {
        filtered[id] = item;
      }
    });
    renderProducts(filtered);
  }

  async function deleteProduct(id) {
    if (confirm("هل تريد بالتأكيد حذف هذا الصنف من المعرض؟")) {
      await fetch(`${DB_URL}/${id}.json`, { method: 'DELETE' });
      loadProducts();
    }
  }

  /* وظائف السلة والتواصل */
  function addToCart(name, price) {
    cart.push({ name, price: Number(price) });
    updateCartUI();
    toggleCart(true);
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
  }

  function updateCartUI() {
    document.getElementById('cartCount').innerText = cart.length;
    const list = document.getElementById('cartItemsList');
    if (cart.length === 0) {
      list.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 30px;">السلة فارغة حالياً</p>';
      document.getElementById('cartTotalPrice').innerText = '0 ج.م';
      return;
    }

    let total = 0;
    list.innerHTML = '';
    cart.forEach((item, idx) => {
      total += item.price;
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div>
          <b style="font-size:13px; display:block;">${item.name}</b>
          <small style="color:var(--primary); font-weight:700;">${item.price} ج.م</small>
        </div>
        <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer;">🗑️</button>
      `;
      list.appendChild(row);
    });
    document.getElementById('cartTotalPrice').innerText = total + ' ج.م';
  }

  function toggleCart(forceOpen) {
    const drawer = document.getElementById('cartDrawer');
    const backdrop = document.getElementById('cartBackdrop');
    if (forceOpen === true || !drawer.classList.contains('open')) {
      drawer.classList.add('open');
      backdrop.classList.add('open');
    } else {
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
    }
  }

  function checkoutWhatsApp() {
    if (cart.length === 0) {
      alert("السلة فارغة!");
      return;
    }
    let total = 0;
    let msg = "السلام عليكم، أود تقديم طلب الشراء التالي:\n\n";
    cart.forEach((item, idx) => {
      total += item.price;
      msg += `${idx + 1}- ${item.name} (${item.price} ج.م)\n`;
    });
    msg += `\n💰 الإجمالي: ${total} ج.م\nيرجى تأكيد التوافر وطريقة الاستلام.`;

    window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  loadProducts();
</script>

</body>
</html>
